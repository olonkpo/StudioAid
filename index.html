<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudioAid</title>
<style>
:root{--bg:#fbfcfc;--panel:#f1f3f4;--ink:#1c2a33;--mute:#667780;--glass:rgba(250,252,253,.86);--line:#d3dadd;--chip:#eceeef;--done:#2e7d32;--start:#0a7ea4;--pause:#b35c00;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181c;--panel:#1b242a;--ink:#e6ecef;--mute:#8d9ca6;--glass:rgba(30,40,46,.86);--line:#35444d;--chip:#242f36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181c;--panel:#1b242a;--ink:#e6ecef;--mute:#8d9ca6;--glass:rgba(30,40,46,.86);--line:#35444d;--chip:#242f36;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Helvetica Neue",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--start);outline-offset:2px}
.desk{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:24px}.desk b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
.mt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px}.mt .sp{flex:1}.mt .sum{font-size:12.5px;color:var(--mute)}
.top{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700}
.sum{font-size:13px;color:var(--mute)}
.top .sp{flex:1;min-width:20px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.addp input,.set input[type=text],.set select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:7px 14px;font-weight:600}
.board{overflow-x:auto;padding-bottom:8px}
.bg{display:grid;gap:6px;min-width:max-content;width:100%}
.ph{background:var(--c);color:#fff;text-align:center;font-size:12px;padding:3px 6px;border-radius:2px}
.sn{text-align:center;font-size:13px;font-weight:600;padding:8px 4px;white-space:nowrap}
.pc{display:flex;align-items:center;gap:8px;position:sticky;left:0;z-index:2;background:var(--bg);padding-right:8px;min-width:0}
.pc.hl{box-shadow:0 0 0 2px var(--start)}
.dt{flex:none;width:8px;height:8px;border-radius:50%}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:#7b8791;color:#fff;display:grid;place-items:center;font-weight:700}
.pn{flex:1;min-width:0;display:flex;flex-direction:column}
.pn b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:12px;color:var(--mute)}
.am{flex:none;width:92px;font-size:13px}
.am input{width:58px;border:0;background:transparent;padding:0;font-size:13px}
.pg{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}.pg i{display:block;height:100%;background:var(--done)}
.x{border:0;background:transparent;color:var(--mute);padding:2px 4px}
.cell{height:54px;border:0;border-radius:3px;background:var(--chip);color:#fff;font-weight:600;font-size:13px}
.cell[data-s=done]{background:var(--done)}.cell[data-s=started]{background:var(--start)}.cell[data-s=paused]{background:var(--pause)}
.cell:hover{filter:brightness(.95)}
.empty{padding:30px 0;color:var(--mute)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{font-size:12px;color:var(--mute);padding:2px 4px}
.day{min-height:92px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.45}.day.td .n{background:var(--ink);color:var(--bg);border-radius:10px;padding:0 7px;align-self:flex-start}
.n{font-size:12.5px;font-weight:600}
.pill{border:0;border-radius:4px;background:var(--c);color:#fff;font-size:11.5px;padding:2px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mon{font-weight:700;min-width:150px;text-align:center}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
/* bubble + bar */
#bubble{position:fixed;z-index:20;border-radius:50%;border:0;padding:0;background:var(--glass);box-shadow:0 0 0 4px var(--c),0 6px 18px rgba(0,0,0,.28);touch-action:none;transition:opacity .4s,left .18s,top .18s;cursor:grab;display:grid;place-items:center;font-weight:700}
#bubble.drag{transition:none;cursor:grabbing}#bubble.idle{opacity:.4}
#bubble small{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}
#bar{position:fixed;z-index:19;width:330px;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);overflow:auto;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 36px rgba(0,0,0,.3);padding:10px;display:none}
#bar.open{display:block;animation:pop .14s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
@media (prefers-reduced-motion:reduce){#bar.open{animation:none}#bubble{transition:none}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:3px;border-radius:10px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:6px 2px;font-size:12.5px;font-weight:600;color:var(--mute)}
.tabs button[aria-pressed=true]{background:var(--c);color:#fff}
.nx{margin:10px 2px}
.qr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.qr span{flex:1;font-weight:600}
.qb{min-width:104px;border:0;border-radius:6px;padding:7px 10px;background:var(--chip);color:var(--mute);font-weight:600}.qb[data-s=done]{background:var(--done);color:#fff}.qb[data-s=started]{background:var(--start);color:#fff}.qb[data-s=paused]{background:var(--pause);color:#fff}
#qsel{width:100%;margin-bottom:10px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px}
.gear{font-size:17px;line-height:1;padding:5px 10px}
.nx .t{font-weight:700;font-size:16px}
.acts{display:flex;gap:6px;margin-top:10px}
.acts button{flex:1;border:0;border-radius:8px;padding:8px;color:#fff;font-weight:600}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.add button{background:var(--c);color:#fff;border:0;border-radius:8px;padding:0 12px;font-weight:600}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
#ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;place-items:center;padding:16px}#ov.open{display:grid}
.set{padding:2px}
.set h2{margin:0 0 8px;font-size:19px}.set h3{font-size:14px;margin:14px 0 6px}
.sr{display:flex;align-items:center;gap:8px;margin:6px 0}.sr label{flex:1}
.sr input[type=color]{flex:none;width:38px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.sr input.w{flex:2}
.pn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}.pn:hover b{text-decoration:underline}
.pv h2{margin:10px 0 4px;font-size:19px}.pv h3{font-size:14px;margin:16px 0 0}
.pv label{display:block;font-size:12.5px;color:var(--mute);margin-top:8px}
.pv input,.pv textarea,.pv select,#bkBox{display:block;width:100%;margin-top:3px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);font:inherit}
.pv .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.pv .acts2{display:flex;gap:8px;margin-top:10px}.pv a.btn{text-decoration:none;color:var(--ink)}
@media(max-width:520px){.pv .g2{grid-template-columns:1fr}}
/* low-profile overrides */
body{font-size:13px}
#bar{border-radius:12px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.2);max-height:min(72vh,580px)}
#bubble{box-shadow:0 0 0 2px var(--c),0 3px 10px rgba(0,0,0,.2)}#bubble.idle{opacity:.3}
#bubble small{top:-5px;right:-5px;min-width:16px;height:16px;font-size:10px;border-radius:8px;padding:0 4px}
.desk{opacity:.45}
.btn{padding:4px 10px;border-radius:7px;font-size:12.5px;background:transparent}
.mt{margin-bottom:8px}.mt .sum{padding-right:4px}
.tabs{grid-template-columns:repeat(4,1fr);margin-bottom:8px}.tabs button{padding:5px 2px}
.bg{gap:4px}.bg.all .pc{position:sticky;left:0;background:var(--glass)}
.pc{position:static;background:transparent;padding-right:4px;gap:6px}
.pn b{font-size:13px;font-weight:600}
.sn{font-size:11.5px;padding:3px 2px;color:var(--mute)}.ph{font-size:11px;padding:2px 6px;border-radius:4px}
.cell{height:28px;font-size:11.5px;border-radius:6px}
.x{opacity:0;font-size:11px}.pc:hover .x,.x:focus-visible{opacity:1}
.addrow input{width:100%;margin-top:8px;background:transparent;border:1px dashed var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px}
.empty{padding:12px 0}.day{min-height:60px;padding:3px}.pill{font-size:11px}
.sn{white-space:normal;line-height:1.15;text-align:center;word-break:break-word}
#studio{position:fixed;inset:12px;z-index:40;display:grid;grid-template-columns:200px 1fr;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
#studio[hidden]{display:none}
.st-side{background:var(--panel);padding:14px 10px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);overflow:auto}
.stn{padding:4px 8px 12px}.stn b{display:block;font-size:15px}
.st-side button{text-align:left;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;white-space:nowrap}
.st-side button[aria-pressed=true]{background:var(--ink);color:var(--bg)}.st-side .stx{margin-top:auto;color:var(--mute)}
.st-main{padding:20px 24px;overflow:auto}.st-main h2{margin:0 0 4px;font-size:21px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.cards>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}.cards b{display:block;font-size:17px}
.prog2{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}.prog2 i{display:block;height:100%;background:var(--done)}
.row2{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.row2 .sp{flex:1}
.od{color:#d64545}.dn{text-decoration:line-through;color:var(--mute)}
.pv input[type=checkbox]{width:auto;margin:0}.pf input{width:auto;margin:0;flex:1;min-width:0}
.wn{flex:1}.dd{width:150px!important;margin:0!important}.addi{margin-top:8px!important}
.cards .amt{font-size:17px;font-weight:700;width:120px;padding:2px 6px;margin:0}
@media(max-width:640px){#studio{grid-template-columns:1fr;grid-template-rows:auto 1fr}.st-side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.stn{display:none}.cards{grid-template-columns:1fr 1fr}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:13px}#toast[hidden]{display:none}#toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline}
.cell.ovd{box-shadow:inset 0 0 0 2px #d64545}
.duel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:12px}.duel button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 9px;font-size:12px}
.bkn{width:100%;margin-bottom:8px;border:1px dashed var(--pause);background:transparent;border-radius:8px;padding:5px;font-size:12px;color:var(--pause)}
.tb{display:flex;gap:6px;margin-bottom:8px}.tb input,.tb select,.addrow select{background:transparent;border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12px;min-width:0}.tb input{flex:1}
.addrow{display:flex;gap:6px}.addrow input{flex:1;width:auto}.addrow select{margin-top:8px;border-style:dashed}
.duep{background:transparent;color:var(--ink);border:1px dashed var(--mute)}
.cn{width:58px!important;margin:0!important;padding:4px 6px!important;display:inline-block!important}.cnw{display:flex;gap:4px;align-items:center;color:var(--mute)}
.st-side [data-act=arch]{margin-top:auto;color:var(--mute)}.st-side .stx{margin-top:0}
@media print{body>*:not(#studio){display:none!important}#studio{position:static;display:block!important;box-shadow:none;border:0}.st-side,.noprint{display:none!important}.st-main{overflow:visible}}
html.native:root{color-scheme:light!important}.native body{background:transparent}.native .desk{display:none}
.native #bar{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}.native .bg.all .pc{background:var(--bg)}
</style>
</head>
<body>
<div class="desk"><div><b>Your editing app goes here</b>Tap the bubble or press Option+Space.</div></div>
<button id="bubble" aria-label="Open StudioAid panel" aria-expanded="false"></button>
<div id="bar" role="dialog" aria-label="StudioAid panel">
<div class="mt" id="mt"><button class="btn" data-v="B">Board</button><button class="btn" data-v="C">Calendar</button><span class="sp"></span><span class="sum" id="sum"></span><button class="btn gear" data-v="S" aria-label="Settings" title="Settings">⚙</button></div>
<section id="vB" hidden><div id="bk"></div><div id="due"></div><div class="tb"><input id="q" placeholder="Search projects" aria-label="Search projects"><select id="vf" aria-label="Show"><option value="act">Active</option><option value="arch">Archived</option><option value="all">All</option></select><select id="sf" aria-label="Sort"><option value="add">Added</option><option value="date">Date</option><option value="name">Name</option></select></div><div id="board" class="board"></div><div class="addrow"><input id="pn" placeholder="+ New project" aria-label="New project name"><select id="pt" aria-label="Template"><option value="">Blank</option><option>Wedding</option><option>Graduation</option><option>Event</option><option>Tour + photo bundle</option></select></div></section>
<section id="vC" hidden><div id="cal"></div></section>
<section id="set" class="set" hidden></section></div>
<div id="toast" hidden></div>
<div id="studio" hidden role="dialog" aria-label="Project studio"><div class="st-side" id="stSide"></div><div class="st-main pv" id="stMain"></div></div>
<script>
const PH=[{n:'Booked',c:'#3b6ea5',s:['Confirm Booking','Send Reminder']},{n:'Processing',c:'#6a5aa5',s:['Meeting','Event','Completion','Delivery']},{n:'Post-project',c:'#2f8a6b',s:['Social Posts','Follow-up','Referrals']}];
const DEF={theme:'auto',size:44,fade:true,cur:'GHS',me:'Ebenezer',cc:'233'};
const ORD=['','started','done','paused'],LBL={'':'',started:'Started',done:'Done',paused:'Paused'};
let S={projects:[],phases:JSON.parse(JSON.stringify(PH)),phase:1,y:200,side:'r',cfg:{},view:'board'};
const NAT=window.native||null;try{Object.assign(S,JSON.parse((NAT?NAT.load():localStorage.getItem('shootbar2'))||'{}'))}catch(e){}
S.cfg=Object.assign({},DEF,S.cfg);
const save=()=>{try{const j=JSON.stringify(S);NAT?NAT.save(j):localStorage.setItem('shootbar2',j)}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})};
const cols=()=>S.phases.flatMap(p=>p.s);
let view=new Date(),hl=null;view.setDate(1);S.view='B';S.all=true;if(S.cfg.size===58)S.cfg.size=44;
function stat(p){const c=cols(),d=c.filter(x=>p.cells[x]==='done').length;return d===c.length?'--done':c.some(x=>p.cells[x])?'--start':'--mute'}
function applyCfg(){const r=document.documentElement;S.cfg.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.cfg.theme);
  const b=$('bubble');b.style.width=b.style.height=S.cfg.size+'px';b.style.fontSize=S.cfg.size*.32+'px'}
function renderBoard(){
  const c=cols(),n=c.length,list=vis(),tot=list.reduce((a,p)=>a+(+p.amount||0),0),td=key(new Date()),lb=S.lb;
  $('sum').textContent=list.length+' \u00b7 '+S.cfg.cur+' '+tot.toLocaleString();
  $('bk').innerHTML=S.projects.length&&!NAT&&(!lb||Date.now()-lb>6048e5)?`<button class="bkn" data-v="S">${lb?'Last backup was over a week ago':'You have not backed up yet'} \u00b7 Back up now</button>`:'';
  const due=[];S.projects.forEach(p=>{if(p.arch)return;Object.entries(p.due||{}).forEach(([x,d])=>{if(d<=td&&p.cells[x]!=='done'&&c.includes(x))due.push({p,x,d})})});due.sort((a,b)=>a.d<b.d?-1:1);
  $('due').innerHTML=due.length?`<div class="duel"><b>${due.length} due or overdue</b>`+due.slice(0,3).map(o=>`<button data-open="${o.p.id}" data-sec0="wf" class="${o.d<td?'od':''}">${esc(o.p.name)} \u2014 ${esc(o.x)} \u00b7 ${o.d<td?'overdue':'today'}</button>`).join('')+(due.length>3?`<span class="m">+${due.length-3} more</span>`:'')+'</div>':'';
  if(!list.length){$('board').innerHTML='<div class="empty">'+(S.projects.length?'No projects match.':'No projects yet. Add one below.')+'</div>';return}
  $('board').innerHTML=`<div class="bg all" style="grid-template-columns:170px repeat(${n},minmax(64px,1fr))"><div></div>`+
  S.phases.map(p=>`<div class="ph" style="--c:${p.c};grid-column:span ${p.s.length}">${esc(p.n)}</div>`).join('')+'<div></div>'+
  c.map(x=>`<div class="sn">${esc(x)}</div>`).join('')+
  list.map(p=>`<div class="pc${hl===p.id?' hl':''}" id="r${p.id}"><i class="dt" style="background:var(${stat(p)})"></i><button class="pn" data-open="${p.id}" aria-label="Open ${esc(p.name)} details"><b>${esc(p.name)}</b><span class="m">${p.date?fmt(p.date):'No date'}</span></button><button class="x" data-del="${p.id}" aria-label="Delete ${esc(p.name)}">\u2715</button></div>`+
    c.map(x=>{const st=p.cells[x]||'',du=(p.due||{})[x],ct=(p.counts||{})[x],od=du&&du<td&&st!=='done',lab=ct&&ct.t&&st!=='done'?(ct.d||0)+'/'+ct.t:LBL[st];return `<button class="cell${od?' ovd':''}" data-s="${st}" data-p="${p.id}" data-c="${esc(x)}" title="${du?'Due '+fmt(du):''}" aria-label="${esc(p.name)}, ${esc(x)}: ${st||'not started'}${od?', overdue':''}">${lab}</button>`}).join('')).join('')+'</div>';
}
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth(),start=new Date(y,m,1-view.getDay()),tk=key(new Date());
  let h=`<div class="cal-h"><button class="btn" data-mv="-1" aria-label="Previous month">‹</button><span class="mon">${view.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><button class="btn" data-mv="1" aria-label="Next month">›</button><button class="btn" data-mv="0">Today</button></div><div class="dow">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div>${d}</div>`).join('')}</div><div class="grid">`;
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(i>=35&&d.getMonth()!==m)break;const k=key(d);
    h+=`<div class="day${d.getMonth()!==m?' out':''}${k===tk?' td':''}"><span class="n">${d.getDate()}</span>`+S.projects.filter(p=>p.date===k).map(p=>`<button class="pill" data-hl="${p.id}" style="--c:var(${stat(p)})">${esc(p.name)}</button>`).join('')+S.projects.flatMap(p=>Object.entries(p.due||{}).filter(([x,dd])=>dd===k&&p.cells[x]!=='done').map(([x])=>`<button class="pill duep" data-open="${p.id}" data-sec0="wf">${esc(p.name)}: ${esc(x)}</button>`)).join('')+'</div>'}
  $('cal').innerHTML=h+'</div>';
}
function renderBar(){
  const cs=cols(),open=S.projects.reduce((a,p)=>a+cs.filter(x=>p.cells[x]!=='done').length,0);
  [$('bubble'),$('bar')].forEach(e=>e.style.setProperty('--c','var(--ink)'));
  $('bubble').innerHTML='\ud83d\udcf7'+(open?`<small>${open}</small>`:'');
}

  if(t.id==='sTheme')S.cfg.theme=t.value;else if(t.id==='sMe')S.cfg.me=t.value;else if(t.id==='sCc')S.cfg.cc=t.value.replace(/\D/g,'');else if(t.id==='sCur')S.cfg.cur=t.value;else if(t.id==='sSize'){S.cfg.size=+t.value;t.previousElementSibling.textContent='Size ('+t.value+'px)'}
  else if(t.id==='sFade')S.cfg.fade=t.checked;
  else if(d.pc)S.phases[d.pc].c=t.value;else if(d.pn)S.phases[d.pn].n=t.value||' ';
  else if(d.ps){const a=t.value.split(',').map(x=>x.trim()).filter(Boolean);if(!a.length)return;migrate(S.phases[d.ps].s,a);S.phases[d.ps].s=a}else return;save();render()};
/* bubble */
const bub=$('bubble'),M=14;let idleT,drag=null;
const BW=()=>S.cfg.size;
function setBubble(){const x=S.side==='l'?M:innerWidth-BW()-M;S.y=Math.max(M,Math.min(innerHeight-BW()-M,S.y));bub.style.left=x+'px';bub.style.top=S.y+'px'}
function wake(){bub.classList.remove('idle');clearTimeout(idleT);if(S.cfg.fade)idleT=setTimeout(()=>{if(!$('bar').classList.contains('open'))bub.classList.add('idle')},3000)}
function place(){setBubble();const bar=$('bar');if(!bar.classList.contains('open'))return;
  const W=({B:800,C:620,P:480,S:420})[S.view]||380;bar.style.width=Math.min(W,innerWidth-24)+'px';const r=bub.getBoundingClientRect(),w=bar.offsetWidth,h=bar.offsetHeight,n=innerWidth<520;
  const l=n?(innerWidth-w)/2:S.side==='l'?r.right+10:r.left-10-w,t=n?(r.top>innerHeight/2?r.top-h-10:r.bottom+10):r.top;
  bar.style.left=Math.max(8,Math.min(innerWidth-w-8,l))+'px';bar.style.top=Math.max(8,Math.min(innerHeight-h-8,t))+'px'}
bub.addEventListener('pointerdown',e=>{bub.setPointerCapture(e.pointerId);drag={sx:e.clientX,sy:e.clientY,ox:bub.offsetLeft,oy:bub.offsetTop,moved:false};wake()});
bub.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>5){drag.moved=true;bub.classList.add('drag')}
  if(drag.moved){bub.style.left=drag.ox+dx+'px';bub.style.top=drag.oy+dy+'px';$('bar').style.left=$('bar').style.top='-999px'}});
bub.addEventListener('pointerup',()=>{if(!drag)return;const m=drag.moved;drag=null;bub.classList.remove('drag');
  if(m){S.side=(bub.offsetLeft+BW()/2)<innerWidth/2?'l':'r';S.y=bub.offsetTop;save();place()}else toggle();wake()});
function toggle(force){const bar=$('bar'),o=force===undefined?!bar.classList.contains('open'):force;
  bar.classList.toggle('open',o);bub.setAttribute('aria-expanded',o);render();wake()}
addEventListener('keydown',e=>{if(e.altKey&&e.code==='Space'){e.preventDefault();if(!NAT)toggle()}
  else if(e.key==='Escape'){if(!$('studio').hidden)closeStudio();else toggle(false)}
  });
addEventListener('resize',place);
document.addEventListener('pointerdown',e=>{if($('bar').classList.contains('open')&&!e.target.closest('#bar,#bubble'))toggle(false)});
S.q='';render();$('vf').value=S.vf||'act';$('sf').value=S.sf||'add';wake();
function notifyDue(){const td=key(new Date());if(S.ln===td)return;const c=cols();let n=0;S.projects.forEach(p=>{if(p.arch)return;Object.entries(p.due||{}).forEach(([x,d])=>{if(d<=td&&p.cells[x]!=='done'&&c.includes(x))n++})});if(n){NAT.notify('StudioAid',n+' step'+(n===1?'':'s')+' due or overdue');S.ln=td;save()}}
if(NAT){document.documentElement.classList.add('native');let on=false;
 document.addEventListener('mousemove',e=>{const i=!!e.target.closest('#bubble,#bar,#studio,#toast');if(i!==on){on=i;NAT.interactive(i)}});
 NAT.onToggle(f=>toggle(f));
 addEventListener('blur',()=>{if($('studio').hidden&&$('bar').classList.contains('open'))toggle(false)});
 notifyDue();setInterval(notifyDue,36e5)}
</script>
